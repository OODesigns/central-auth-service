# JDBC URL to connect to the Postgres service named "db" (from docker-compose)
flyway.url=jdbc:postgresql://db:5432/${POSTGRES_DB}

# Database user with migration permissions (should match Compose env)
flyway.user=${POSTGRES_USER}

# Password for the above user (again, match Compose)
flyway.password=${POSTGRES_PASSWORD}

# Where migration SQL files live (inside the container)
flyway.locations=filesystem:/workspace/flyway/sql