  # Named volume to persist PostgreSQL data even if the container is destroyed.
  # You later see this in the db service being assigned a volume to mount
volumes:
  postgres-data:

  # External network: We simply tell Compose “pg-network” already exists, please join it.
  # Dual‐network: By listing both default and pg-network under your db, your services can talk to each
  # other via the default network and pgAdmin can reach them via pg-network.
networks:
  # Compose’s own default network for app<->db
  default:
    name: central-auth-service_default

  # Your pre-existing pg-network (external, already created)
  pg-network:
    external: true

services:
  # =======================
  # App Container (Java Auth Service)
  # =======================
  app:
    # Custom name for the app container.
    # Docker itself uses it to refer to the running container.
    container_name: auth-service
    build: 
      # The build context is the set of files and directories that Docker sends to
      # the Docker Engine during a docker build.
      # The (dot) means: Use the current directory (where your docker-compose.yml file is)
      # ← one level up, where your code is
      context: ..
      # Uses the specified Dockerfile to build the app container.
      # The standard and expected name
      dockerfile: .devcontainer/Dockerfile
    # Mounts the project root two levels up into /workspaces inside the container.
    # cached mode to improve performance (on macOS especially).
    # So if your docker-compose.yml is located at:
    # /home/your-name/dev/myproject/.devcontainer/docker-compose.yml
    # Then:
    # ../.. = /home/your-name/dev/myproject
    # Mount the root of your project (2 levels up) into the container.
    # /workspaces
    # This is the target path inside the container.
    # So your container will see your entire project (your code, resources, etc.) available at:
    # docker-entrypoint-initdb.d is a magic folder that the official postgres Docker image watches at container
    # startup — specifically, during the first-time initialization of the database volume.
    volumes:
      - ../..:/workspaces:cached
    # Keeps the container running indefinitely, suitable for dev containers.
    command: sleep infinity
    # Shares the network stack with the db container, allowing 'localhost' to reach the DB.
    # The db is referenced later
    # It means Then inside the flyway container, you can connect to the Postgres DB like this:
    # jdbc:postgresql://localhost:5432/mydb rather than jdbc:postgresql://db:5432/mydb
    # Because from Flyway’s point of view, it is on the same IP stack as the db container.
    # localhost literally points to the db container.
    # Attach to both the default Compose network AND pg-network
    networks:
      - default
      - pg-network
    environment:
      # Auth service specific environment variables
      # JDBC-style connection string for the database.
      DATABASE_URL: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
      # Indicates development environment.
      NODE_ENV: development
      # JWT secret key for signing tokens.
      JWT_SECRET: ${JWT_SECRET}
      # Used by your Java app to load its own private key (for mTLS or TLS client/server authentication).
      # This password protects the .jks or .p12 file that contains the app’s private key and certificate.
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      # Used to verify the identity of the remote service (machine-to-machine).
      # This unlocks the truststore file that holds trusted Certificate Authorities (CAs) or specific server certificates.
      TRUSTSTORE_PASSWORD: ${TRUSTSTORE_PASSWORD}
    depends_on:
      - db  # Ensures db service is started before app

  # =======================
  # Database Service (PostgreSQL)
  # =======================
  db:
    # Custom name for the Postgres container.
    container_name: auth-db
    # Uses the official PostgreSQL version 15 image.
    image: postgres:15
    # Restarts the container unless explicitly stopped.
    # If this container stops or crashes, try to start it again — unless I (the user) told you not to.
    restart: unless-stopped
    # in initdb Make sure the file has the executable bit before you commit chmod +x db/init/01_init_database.sh
    # Preferred: set the executable bit in Git via git update-index --chmod=+x ….
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    environment:
      # These are the official, built-in Docker-Postgres variables:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} #
      # If your script creates a separate "app" database + roles:
      APP_DB: ${APP_DB}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
      # ← tell initdb to use C.utf8 for the entire cluster
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.utf8"
    # Attach to both the default Compose network AND pg-network
    networks:
      - default
      - pg-network
    # Exposes Postgres on host port 5432 for external access (e.g., IntelliJ).
    ports:
      - "5432:5432"




