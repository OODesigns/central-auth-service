# JDBC URL to connect to the Postgres service (from docker-compose)
flyway.url=jdbc:postgresql://db:5432/${APP_DB}

# Database user with migration permissions (should match Compose env)
flyway.user=${POSTGRES_USER}

# Password for the above user (again, match Compose)
flyway.password=${POSTGRES_PASSWORD}

# Where migration SQL files live (inside the container)
flyway.locations=filesystem:/flyway/sql

# Default password for admin
flyway.placeholders.ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}

# API role credentials (injected from docker-compose environment)
flyway.placeholders.API_USER=${API_USER}
flyway.placeholders.API_PASSWORD=${API_PASSWORD}

# Environment mode for conditional logic (development vs production)
# NOTE: 'flyway.env' is not a valid Flyway property (newer Flyway versions fail on it).
# No migration currently uses this value; re-introduce as a placeholder if needed:
# flyway.placeholders.ENVIRONMENT=${ENVIRONMENT}
