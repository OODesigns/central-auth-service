name: central-auth-service

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      APP_DB: ${APP_DB:-auth_db}
      API_USER: ${API_USER:-app_user}
      API_PASSWORD: ${API_PASSWORD:?API_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.utf8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.devcontainer/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  flyway:
    image: redgate/flyway:11.8.2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB: ${APP_DB:-auth_db}
      API_USER: ${API_USER:-app_user}
      API_PASSWORD: ${API_PASSWORD:?API_PASSWORD is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      LOAD_TEST_DATA: "false"
      TOTP_TEST_SECRET: disabled
      TOTP_TEST_ENCRYPTION_KEY: disabled
    volumes:
      - ./.devcontainer/flyway/conf/flyway.conf:/flyway/conf/flyway.conf:ro
      - ./.devcontainer/flyway/sql:/flyway/sql:ro
    command: ["migrate"]
    depends_on:
      db:
        condition: service_healthy

  app:
    image: central-auth-service:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      APP_DB: ${APP_DB:-auth_db}
      APP_USER: ${API_USER:-app_user}
      DB_USER: ${API_USER:-app_user}
      APP_PASSWORD: ${API_PASSWORD:?API_PASSWORD is required}
      GRPC_PORT: "50051"
      TOTP_ISSUER: ${TOTP_ISSUER:-CentralAuthService}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:-JWT_SECRET}
      JWT_PREVIOUS_KEY_IDS: ${JWT_PREVIOUS_KEY_IDS:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD is required}
      TRUSTSTORE_PASSWORD: ${TRUSTSTORE_PASSWORD:?TRUSTSTORE_PASSWORD is required}
      KEYSTORE_PATH: ${KEYSTORE_PATH:-}
      TRUSTSTORE_PATH: ${TRUSTSTORE_PATH:-}
      ALLOW_PLAINTEXT: ${ALLOW_PLAINTEXT:-false}
      GRPC_REFLECTION_ENABLED: ${GRPC_REFLECTION_ENABLED:-false}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-database}
      OTEL_METRICS_PORT: "9464"
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
    ports:
      - "${GRPC_HOST_PORT:-50051}:50051"
    depends_on:
      flyway:
        condition: service_completed_successfully

  grpcui:
    image: fullstorydev/grpcui:v1.4.1
    profiles: ["trial"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    command:
      ["-plaintext", "-bind", "0.0.0.0", "-port", "8080", "-import-path", "/protos",
       "-import-path", "/includes", "-proto", "auth.proto", "app:50051"]
    ports:
      - "127.0.0.1:${GRPCUI_HOST_PORT:-8080}:8080"
    volumes:
      - ./src/main/proto:/protos:ro
      - ./build/extracted-include-protos/main:/includes:ro
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    restart: unless-stopped
    user: "472"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
