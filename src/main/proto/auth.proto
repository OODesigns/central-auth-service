syntax = "proto3";

package cas;

option java_package = "com.oodesigns.cas.infrastructure.grpc.proto";
option java_outer_classname = "AuthProto";
option java_multiple_files = true;

// Central Authentication Service — gRPC API
// Transport values are validated and converted to domain value objects at the
// infrastructure boundary. The contract does not use JSON envelopes.
service AuthService {
    // Authenticate with username + password. Returns tokens, 2FA challenge, or error.
    rpc Login(LoginRequest) returns (LoginResponse);

    // Initiate TOTP 2FA setup — generates a secret and otpauth:// URI for QR code display.
    rpc SetupTotp(SetupTotpRequest) returns (SetupTotpResponse);

    // Complete TOTP 2FA enrolment — verifies the first OTP code and returns backup codes.
    rpc EnableTotp(EnableTotpRequest) returns (EnableTotpResponse);

    // Exchange a 2FA verification token + OTP/backup code for full access tokens.
    rpc VerifyTotp(VerifyTotpRequest) returns (VerifyTotpResponse);

    // Rotate a refresh token for a fresh access + refresh token pair (reuse-detecting).
    rpc Refresh(RefreshRequest) returns (RefreshResponse);

    // Revoke the presented access token and end the current session.
    rpc Logout(LogoutRequest) returns (LogoutResponse);

    // Disable TOTP 2FA after password re-authentication.
    rpc DisableTotp(DisableTotpRequest) returns (DisableTotpResponse);

    // Disable another user's TOTP 2FA with administrative authorization.
    rpc AdminDisableTotp(AdminDisableTotpRequest) returns (AdminDisableTotpResponse);
}

// ============================================================================
// Login
// ============================================================================

message LoginRequest {
    string username   = 1;
    string password   = 2;
    // Deprecated: the server derives the peer address from the gRPC transport.
    string ip_address = 3 [deprecated = true];
        reserved 1000 to 1999;
}

message LoginResponse {
    oneof result {
        LoginSuccess              success                = 1;
        Login2FARequired          totp_required          = 2;
        LoginPasswordResetRequired password_reset_required = 3;
        Error                     error                  = 4;
        LoginMfaEnrollmentRequired mfa_enrollment_required = 5;
    }
        reserved 1000 to 1999;
}

message LoginSuccess {
    string          access_token  = 1;
    string          refresh_token = 2;
    string          user_id       = 3;
    repeated string permissions   = 4;
        reserved 1000 to 1999;
}

message Login2FARequired {
    string verification_token = 1;
    string user_id            = 2;
        reserved 1000 to 1999;
}

message LoginPasswordResetRequired {
    string user_id = 1;
        reserved 1000 to 1999;
}

message LoginMfaEnrollmentRequired {
    string enrollment_token = 1;
    string user_id = 2;
        reserved 1000 to 1999;
}

// ============================================================================
// Setup TOTP
// ============================================================================

message SetupTotpRequest {
    // Validated as a UUID and bound to the authenticated/enrollment principal.
    string user_id  = 1;
    // Validated as a normalized username for the otpauth label.
    string username = 2;
        reserved 1000 to 1999;
}

message SetupTotpResponse {
    oneof result {
        SetupTotpSuccess success = 1;
        Error            error   = 2;
    }
        reserved 1000 to 1999;
}

message SetupTotpSuccess {
    string secret      = 1;
    string otpauth_uri = 2;
        reserved 1000 to 1999;
}

// ============================================================================
// Enable TOTP
// ============================================================================

message EnableTotpRequest {
    // Validated as a UUID and bound to the authenticated/enrollment principal.
    string user_id   = 1;
    // Exactly six decimal digits after boundary validation.
    string totp_code = 2;
        reserved 1000 to 1999;
}

message EnableTotpResponse {
    oneof result {
        EnableTotpSuccess success = 1;
        Error             error   = 2;
    }
        reserved 1000 to 1999;
}

message EnableTotpSuccess {
    repeated string backup_codes = 1;
        reserved 1000 to 1999;
}

// ============================================================================
// Verify TOTP (2FA login challenge)
// ============================================================================

message VerifyTotpRequest {
    // Opaque short-lived token; validated into a typed domain token at ingress.
    string verification_token = 1;
    // Either a 6-digit OTP (e.g. "123456") or a backup code (e.g. "ABCD-EFGH-IJKL-MNOP")
    string code = 2;
        reserved 1000 to 1999;
}

message VerifyTotpResponse {
    oneof result {
        VerifyTotpSuccess success = 1;
        Error             error   = 2;
    }
        reserved 1000 to 1999;
}

message VerifyTotpSuccess {
    string          access_token  = 1;
    string          refresh_token = 2;
    string          user_id       = 3;
    repeated string permissions   = 4;
        reserved 1000 to 1999;
}

// ============================================================================
// Refresh (refresh-token rotation)
// ============================================================================

message RefreshRequest {
    // Opaque refresh token; validated into a typed domain token at ingress.
    string refresh_token = 1;
        reserved 1000 to 1999;
}

message RefreshResponse {
    oneof result {
        RefreshSuccess success = 1;
        Error          error   = 2;
    }
        reserved 1000 to 1999;
}

message RefreshSuccess {
    string          access_token  = 1;
    string          refresh_token = 2;
    string          user_id       = 3;
    repeated string permissions   = 4;
        reserved 1000 to 1999;
}

// ============================================================================
// Logout / access-token revocation
// ============================================================================

message LogoutRequest {
    // Opaque access token; validated into a typed domain token at ingress.
    string access_token = 1;
        reserved 1000 to 1999;
}

message LogoutResponse {
    oneof result {
        LogoutSuccess success = 1;
        Error         error   = 2;
    }
        reserved 1000 to 1999;
}

message LogoutSuccess {
    reserved 1000 to 1999;
}

// ============================================================================
// Disable TOTP
// ============================================================================

message DisableTotpRequest {
    // Validated as a UUID and bound to the authenticated principal.
    string        user_id  = 1;
    // Converted to a clearable password value object at ingress.
    string        password = 2;
    DisableReason reason   = 3;
    reserved 1000 to 1999;
}

enum DisableReason {
    DISABLE_REASON_UNSPECIFIED = 0;
    USER_REQUESTED             = 1;
    ADMIN_FORCED               = 2;
    SECURITY_INCIDENT          = 3;
    RECOVERY_FLOW              = 4;
}

message DisableTotpResponse {
    oneof result {
        DisableTotpSuccess success = 1;
        Error              error   = 2;
    }
        reserved 1000 to 1999;
}

message DisableTotpSuccess {
    reserved 1000 to 1999;
}

message AdminDisableTotpRequest {
    string target_user_id = 1;
    string admin_password = 2;
    DisableReason reason = 3;
    reserved 1000 to 1999;
}

message AdminDisableTotpResponse {
    oneof result {
        AdminDisableTotpSuccess success = 1;
        Error error = 2;
    }
    reserved 1000 to 1999;
}

message AdminDisableTotpSuccess {
    reserved 1000 to 1999;
}

// ============================================================================
// Common types
// ============================================================================

message Error {
    string error_code    = 1;
    string error_message = 2;
    reserved 1000 to 1999;
}

