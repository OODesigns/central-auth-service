# Database Configuration
# Uses environment variables from .env file or docker-compose
db.host=${DB_HOST:db}
db.port=${DB_PORT:5432}
db.name=${APP_DB:auth_db}
db.user=${APP_USER:app_user}
db.username=${DB_USER:app_user}
db.password=${APP_PASSWORD:}

# JDBC URL constructed from parts above
# For docker-compose: jdbc:postgresql://db:5432/auth_db
db.url=jdbc:postgresql://${db.host}:${db.port}/${db.name}

# PostgreSQL Driver
db.driver=org.postgresql.Driver

# Connection Pool Settings (optional, for future use)
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=30000

# gRPC Server Configuration
grpc.port=${GRPC_PORT:50051}
grpc.max-inbound-message-bytes=${GRPC_MAX_INBOUND_MESSAGE_BYTES:1048576}
grpc.max-inbound-metadata-bytes=${GRPC_MAX_INBOUND_METADATA_BYTES:16384}
# Keepalive policy limits idle and abusive connections; clients should also set deadlines.
grpc.keepalive-time-minutes=${GRPC_KEEPALIVE_TIME_MINUTES:5}
grpc.keepalive-timeout-seconds=${GRPC_KEEPALIVE_TIMEOUT_SECONDS:20}
grpc.max-connection-idle-minutes=${GRPC_MAX_CONNECTION_IDLE_MINUTES:30}

# TLS Configuration. Plaintext requires an explicit opt-in for local development or
# deployments where TLS is terminated by a trusted sidecar/load balancer.
grpc.tls.keystore.path=${KEYSTORE_PATH:}
grpc.tls.truststore.path=${TRUSTSTORE_PATH:}
grpc.tls.allow-plaintext=${ALLOW_PLAINTEXT:false}
grpc.tls.require-machine-client=${REQUIRE_MACHINE_CLIENT:false}
grpc.health.enabled=${GRPC_HEALTH_ENABLED:true}
grpc.reflection.enabled=${GRPC_REFLECTION_ENABLED:false}
otel.metrics.port=${OTEL_METRICS_PORT:9464}
deployment.environment=${DEPLOYMENT_ENVIRONMENT:local}
rate-limit.backend=${RATE_LIMIT_BACKEND:database}
totp-rate-limit.backend=${TOTP_RATE_LIMIT_BACKEND:database}
jwt.active-key-id=${JWT_ACTIVE_KEY_ID:JWT_SECRET}
jwt.previous-key-ids=${JWT_PREVIOUS_KEY_IDS:}
secrets.backend=${SECRETS_BACKEND:environment}
secrets.directory=${SECRETS_DIRECTORY:/run/secrets}

# TOTP Issuer Name (shown in authenticator apps)
totp.issuer=${TOTP_ISSUER:CentralAuthService}
