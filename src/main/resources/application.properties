# Database Configuration
# Uses environment variables from .env file or docker-compose
db.host=${DB_HOST:db}
db.port=${DB_PORT:5432}
db.name=${APP_DB:auth_db}
db.user=${APP_USER:app_user}
db.password=${APP_PASSWORD:password}

# JDBC URL constructed from parts above
# For docker-compose: jdbc:postgresql://db:5432/auth_db
db.url=jdbc:postgresql://${db.host}:${db.port}/${db.name}

# PostgreSQL Driver
db.driver=org.postgresql.Driver

# Connection Pool Settings (optional, for future use)
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=30000

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.keyId=default

# Security Settings
security.admin.initialPassword=${ADMIN_PASSWORD_PLAIN:admin_initial_password}
security.ratelimit.requests=5
security.ratelimit.duration=1m

# Application Environment
app.env=${NODE_ENV:development}
