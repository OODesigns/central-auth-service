global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: central-auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["app:9464"]
        labels:
          service: central-auth-service
          environment: local
