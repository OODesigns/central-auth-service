name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d auth_db" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Grant execute for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U test && break || sleep 1;
          done

      - name: Run unit + integration tests + coverage verification
        env:
          RUN_DATABASE_TESTS: true
          API_USER: test
          API_PASSWORD: test
          ADMIN_PASSWORD_HASH: "$2a$10$12345678901234567890123456789012345678901234567890123"
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/auth_db
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_NAME: auth_db
          DATABASE_USER: test
          DATABASE_PASSWORD: test
        run: |
          ./gradlew test integrationTest databaseIntegrationTest -PincludeDbTests jacocoTestCoverageVerification --no-daemon --stacktrace

