# Gradle Configuration Properties
# ================================

# Configuration Cache
# Speeds up builds by caching the result of the configuration phase.
# When enabled, Gradle stores the task graph and avoids re-evaluating build scripts.
# Particularly useful for incremental builds and CI/CD pipelines.
# See: https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# Parallel Execution
# Enables parallel execution of tasks across multiple projects.
# Gradle will use multiple threads to execute independent tasks simultaneously,
# reducing overall build time. Recommended for multi-module projects.
# See: https://docs.gradle.org/current/userguide/performance.html#parallel_execution
org.gradle.parallel=true

# JVM Arguments for Gradle Daemon
# Configures the JVM that runs the Gradle daemon process.
# -Xmx2g: Sets maximum heap size to 2GB (adjust based on project size)
# -XX:MaxMetaspaceSize=512m: Limits metaspace to prevent memory leaks
# Increase these values for larger projects if you experience out-of-memory errors.
# See: https://docs.gradle.org/current/userguide/build_environment.html#sec:configuring_jvm_memory
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
