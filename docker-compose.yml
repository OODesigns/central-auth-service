# Home Control System — Docker Compose
# Starts all services and their dependencies

services:
  # ─── Infrastructure ───────────────────────────────────────────────
  
  mqtt:
    image: eclipse-mosquitto:2
    container_name: home-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-log:/mosquitto/log

  postgres:
    image: postgres:16
    container_name: home-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homecontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homecontrol}
      POSTGRES_DB: ${POSTGRES_DB:-homecontrol}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ─── Services ─────────────────────────────────────────────────────

  auth-service:
    build: ./auth-service
    container_name: home-auth
    depends_on:
      - postgres
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-homecontrol}
      POSTGRES_USER: ${POSTGRES_USER:-homecontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homecontrol}
    ports:
      - "8443:8443"

